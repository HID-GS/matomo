# Action for running tests
# This file has been automatically created.
# To recreate it you can run this command
# ./console generate:test-action --php-versions="7.2,8.2"

name: Matomo Tests

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - '**.x-dev'
      - 'next_release'
  workflow_dispatch:
  workflow_call:
    inputs:
      is_preview:
        type: boolean
        required: false
        default: false
      ref:
        type: string
        required: false
        default: ''
    secrets:
      ARTIFACTS_PASS:
        required: false
      TESTOMATIO_INTEGRATION:
        required: false
  schedule:
    # Run every 2 hours from Saturday 00:00 (Germany) until Sunday 16:00 (Germany)
    # Germany assumed CET (UTC+1):
    # - Start: Sat 00:00 DE  -> Fri 23:00 UTC
    # - End:   Sun 16:00 DE -> Sun 15:00 UTC
    #
    # Friday 23:00 UTC (Sat 00:00 DE)
    - cron: "0 23 * * 5"
    # All odd hours on Saturday UTC: 01,03,...,23
    - cron: "0 1-23/2 * * 6"
    # Sunday UTC hours: 01,03,05,07,09,11,13,15 (up to 16:00 DE)
    - cron: "0 1-15/2 * * 0"

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  issues: read
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

concurrency:
  group: php-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  PHP_TEST_ENVIRONMENTS: >-
    [{"php":"7.2","adapter":"PDO_MYSQL","mysql-engine":"Mysql","mysql-version":"5.7"},{"php":"8.2","adapter":"PDO_MYSQL","mysql-engine":"Mariadb","mysql-version":"11.4"},{"php":"8.5","adapter":"MYSQLI","mysql-engine":"Mysql","mysql-version":"8.0"}]

jobs:
  generate-matrices:
    runs-on: ubuntu-24.04
    outputs:
      unit_matrix: ${{ steps.generate.outputs.unit_matrix }}
      system_core_matrix: ${{ steps.generate.outputs.system_core_matrix }}
      system_plugins_matrix: ${{ steps.generate.outputs.system_plugins_matrix }}
      integration_core_matrix: ${{ steps.generate.outputs.integration_core_matrix }}
      integration_plugins_matrix: ${{ steps.generate.outputs.integration_plugins_matrix }}
      ui_core_matrix: ${{ steps.generate.outputs.ui_core_matrix }}
      ui_plugins_matrix: ${{ steps.generate.outputs.ui_plugins_matrix }}
      system_plugins_count: ${{ steps.generate.outputs.system_plugins_count }}
      integration_plugins_count: ${{ steps.generate.outputs.integration_plugins_count }}
      ui_plugins_count: ${{ steps.generate.outputs.ui_plugins_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          submodules: true
          path: matomo
          ref: ${{ inputs.ref || github.ref }}
      - name: Generate test matrices
        id: generate
        run: python3 matomo/.github/scripts/generate_matomo_test_matrices.py --repo-root matomo --ui-core-group-count "${{ vars.UI_CORE_GROUP_COUNT || 4 }}"

  UnitTests:
    runs-on: ubuntu-24.04
    needs: generate-matrices
    strategy:
      fail-fast: ${{ inputs.is_preview == true }}
      max-parallel: ${{ vars.MAX_PARALLEL_UNIT_TESTS || 3 }}
      matrix:
        include: ${{ fromJson(needs.generate-matrices.outputs.unit_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          submodules: true
          path: matomo
          ref: ${{ inputs.ref || github.ref }}
      - name: running tests
        uses: matomo-org/github-action-tests@main
        with:
          test-type: 'UnitTests'
          mysql-driver: ${{ matrix.adapter }}
          mysql-engine: ${{ matrix['mysql-engine'] }}
          mysql-version: ${{ matrix['mysql-version'] }}
          php-version: ${{ matrix.php }}
          redis-service: true
          artifacts-pass: ${{ secrets.ARTIFACTS_PASS }}
          testomatio: ${{ secrets.TESTOMATIO_INTEGRATION }}
          testomatio-force-report: ${{ contains('schedule,push', github.event_name) && github.run_attempt < 2 }}

  SystemTestsCore:
    runs-on: ubuntu-24.04
    needs: generate-matrices
    strategy:
      fail-fast: ${{ inputs.is_preview == true }}
      max-parallel: ${{ vars.MAX_PARALLEL_SYSTEM_CORE || 10 }}
      matrix:
        include: ${{ fromJson(needs.generate-matrices.outputs.system_core_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          submodules: true
          path: matomo
          ref: ${{ inputs.ref || github.ref }}
      - name: running tests
        uses: matomo-org/github-action-tests@main
        with:
          test-type: 'SystemTestsCore'
          mysql-driver: ${{ matrix.adapter }}
          mysql-engine: ${{ matrix['mysql-engine'] }}
          mysql-version: ${{ matrix['mysql-version'] }}
          php-version: ${{ matrix.php }}
          redis-service: true
          artifacts-pass: ${{ secrets.ARTIFACTS_PASS }}
          upload-artifacts: ${{ matrix.php == '7.2' }}
          testomatio: ${{ secrets.TESTOMATIO_INTEGRATION }}
          testomatio-force-report: ${{ contains('schedule,push', github.event_name) && github.run_attempt < 2 }}

  SystemTestsPlugins:
    runs-on: ubuntu-24.04
    needs: generate-matrices
    if: ${{ needs.generate-matrices.outputs.system_plugins_count != '0' }}
    strategy:
      fail-fast: ${{ inputs.is_preview == true }}
      max-parallel: ${{ vars.MAX_PARALLEL_SYSTEM_PLUGINS || 10 }}
      matrix:
        include: ${{ fromJson(needs.generate-matrices.outputs.system_plugins_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          submodules: true
          path: matomo
          ref: ${{ inputs.ref || github.ref }}
      - name: running tests
        uses: matomo-org/github-action-tests@main
        with:
          test-type: 'SystemTestsPlugins'
          mysql-driver: ${{ matrix.adapter }}
          mysql-engine: ${{ matrix['mysql-engine'] }}
          mysql-version: ${{ matrix['mysql-version'] }}
          php-version: ${{ matrix.php }}
          phpunit-test-options: ${{ matrix['phpunit-path'] }}
          redis-service: true
          artifacts-pass: ${{ secrets.ARTIFACTS_PASS }}
          upload-artifacts: ${{ matrix.php == '7.2' }}
          testomatio: ${{ secrets.TESTOMATIO_INTEGRATION }}
          testomatio-force-report: ${{ contains('schedule,push', github.event_name) && github.run_attempt < 2 }}

  IntegrationTestsCore:
    runs-on: ubuntu-24.04
    needs: generate-matrices
    strategy:
      fail-fast: ${{ inputs.is_preview == true }}
      max-parallel: ${{ vars.MAX_PARALLEL_INTEGRATION_CORE || 10 }}
      matrix:
        include: ${{ fromJson(needs.generate-matrices.outputs.integration_core_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          submodules: true
          path: matomo
          ref: ${{ inputs.ref || github.ref }}
      - name: running tests
        uses: matomo-org/github-action-tests@main
        with:
          test-type: 'IntegrationTestsCore'
          mysql-driver: ${{ matrix.adapter }}
          mysql-engine: ${{ matrix['mysql-engine'] }}
          mysql-version: ${{ matrix['mysql-version'] }}
          php-version: ${{ matrix.php }}
          redis-service: true
          testomatio: ${{ secrets.TESTOMATIO_INTEGRATION }}
          testomatio-force-report: ${{ contains('schedule,push', github.event_name) && github.run_attempt < 2 }}

  IntegrationTestsPlugins:
    runs-on: ubuntu-24.04
    needs: generate-matrices
    if: ${{ needs.generate-matrices.outputs.integration_plugins_count != '0' }}
    strategy:
      fail-fast: ${{ inputs.is_preview == true }}
      max-parallel: ${{ vars.MAX_PARALLEL_INTEGRATION_PLUGINS || 20 }}
      matrix:
        include: ${{ fromJson(needs.generate-matrices.outputs.integration_plugins_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          submodules: true
          path: matomo
          ref: ${{ inputs.ref || github.ref }}
      - name: running tests
        uses: matomo-org/github-action-tests@main
        with:
          test-type: 'IntegrationTestsPlugins'
          mysql-driver: ${{ matrix.adapter }}
          mysql-engine: ${{ matrix['mysql-engine'] }}
          mysql-version: ${{ matrix['mysql-version'] }}
          php-version: ${{ matrix.php }}
          phpunit-test-options: ${{ matrix['phpunit-path'] }}
          redis-service: true
          testomatio: ${{ secrets.TESTOMATIO_INTEGRATION }}
          testomatio-force-report: ${{ contains('schedule,push', github.event_name) && github.run_attempt < 2 }}

  Javascript:
    runs-on: ubuntu-24.04
    needs: generate-matrices
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          submodules: true
          path: matomo
          ref: ${{ inputs.ref || github.ref }}
      - name: running tests
        uses: matomo-org/github-action-tests@main
        with:
          test-type: 'JS'
          php-version: '7.2'
          node-version: '12'

  Client:
    runs-on: ubuntu-24.04
    needs: generate-matrices
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          persist-credentials: false
          submodules: true
          path: matomo
          ref: ${{ inputs.ref || github.ref }}
      - name: running tests
        uses: matomo-org/github-action-tests@main
        with:
          test-type: 'Client'
          node-version: '16'
          mysql-service: false

  UICore:
    runs-on: ubuntu-24.04
    needs: generate-matrices
    strategy:
      fail-fast: ${{ inputs.is_preview == true }}
      max-parallel: ${{ vars.MAX_PARALLEL_UI_CORE || 10 }}
      matrix:
        include: ${{ fromJson(needs.generate-matrices.outputs.ui_core_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
          submodules: true
          path: matomo
          ref: ${{ inputs.ref || github.ref }}
      - name: running tests
        uses: matomo-org/github-action-tests@main
        with:
          ui-test-options: '--core-tests-only --num-test-groups=${{ vars.UI_CORE_GROUP_COUNT || 4 }} --test-group=${{ matrix.part }}'
          test-type: 'UI'
          php-version: '7.2'
          node-version: '16'
          redis-service: true
          artifacts-pass: ${{ secrets.ARTIFACTS_PASS }}
          upload-artifacts: true
          testomatio: ${{ secrets.TESTOMATIO_INTEGRATION }}
          testomatio-force-report: ${{ contains('schedule,push', github.event_name) && github.run_attempt < 2 }}

  UIPlugins:
    runs-on: ubuntu-24.04
    needs: generate-matrices
    if: ${{ needs.generate-matrices.outputs.ui_plugins_count != '0' }}
    strategy:
      fail-fast: ${{ inputs.is_preview == true }}
      max-parallel: ${{ vars.MAX_PARALLEL_UI_PLUGINS || 15 }}
      matrix:
        include: ${{ fromJson(needs.generate-matrices.outputs.ui_plugins_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
          submodules: true
          path: matomo
          ref: ${{ inputs.ref || github.ref }}
      - name: running tests
        uses: matomo-org/github-action-tests@main
        with:
          ui-test-options: "--plugin=${{ matrix['plugin-name'] }}"
          test-type: 'UI'
          php-version: '7.2'
          node-version: '16'
          redis-service: true
          artifacts-pass: ${{ secrets.ARTIFACTS_PASS }}
          upload-artifacts: true
          testomatio: ${{ secrets.TESTOMATIO_INTEGRATION }}
          testomatio-force-report: ${{ contains('schedule,push', github.event_name) && github.run_attempt < 2 }}
